org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ============================================================
# JDK-Pfad (optional)
# ------------------------------------------------------------
# Wenn dein JDK 21 nicht automatisch gefunden wird, setze
# JAVA_HOME oder lege eine 'gradle-local.properties' an mit:
#   org.gradle.java.home=C:\\Pfad\\zu\\jdk-21
# Diese Datei wird via .gitignore ignoriert.
# ============================================================

# ============================================================
# Mod-Metadaten - EINZIGE Quelle der Wahrheit
# ------------------------------------------------------------
# Erhoehe die Version mit:
#   python bump_version.py [patch|minor|major|x.y.z]
# Optional: --tag (Git-Tag) oder --commit (Commit + Tag).
# ============================================================
mod_version=2.0.5
mod_group=de.bastild.restoreinv
mod_id=restoreinv
mod_archives_name=RestoreInventory

# ============================================================
# Minecraft / Fabric Versionen
# ------------------------------------------------------------
# Mit `python update_fabric.py [<mc_version>]` automatisch
# auf neueste Versionen anheben (nutzt fabric-meta + modrinth).
# ============================================================
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.2
fabric_api_version=0.119.4+1.21.4
